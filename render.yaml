# Render.com Blueprint Specification
# Pozitron Market - Cloud Backend API
services:
  - type: web
    name: pozitron-market-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 server.py"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: POZITRON_ENV
        value: production
      - key: ADMIN_API_KEY
        value: pzt_adm_sec_9941a87b32c
