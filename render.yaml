# Render.com Blueprint Specification
# Pozitron Market - Cloud Backend API
services:
  - type: web
    name: pozitron-market-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 server.py"
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - assets/**
        - products/**
        - data/**
        - tests/**
        - docs/**
        - "*.md"
    envVars:
      - key: POZITRON_ENV
        value: production
      - key: POZITRON_BIND_PUBLIC
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
