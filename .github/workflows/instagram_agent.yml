name: Pozitron Instagram PR Agent & Engagement Robot

on:
  schedule:
    # Runs every 3 hours to check dynamic posting frequency & daily engagement
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Islem Tipi'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'direct_publish'
          - 'engage_only'
          - 'auto_cycle'
      content_type:
        description: 'Icerik Konsepti (Opsiyonel)'
        required: false
        default: 'random'
        type: choice
        options:
          - 'random'
          - 'product_spotlight'
          - 'tool_showcase'
          - 'deal_drop'
          - 'pilot_tip'
          - 'review_highlight'
      dry_run:
        description: 'Dry-Run (Test / Simulasyon Modu)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  run-instagram-pr:
    name: Autonomous Instagram PR & Drone Engagement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Git Committer
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Instagram PR Agent & Drone Engagement
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID || '17841430407836914' }}
          INSTAGRAM_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          INSTAGRAM_COOKIES_JSON: ${{ secrets.INSTAGRAM_COOKIES_JSON }}
          INSTAGRAM_SESSIONID: ${{ secrets.INSTAGRAM_SESSIONID }}
          INSTAGRAM_CSRFTOKEN: ${{ secrets.INSTAGRAM_CSRFTOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: 'true'
        run: |
          echo "📸 Pozitron Market Instagram PR Robotu Calistiriliyor..."
          python3 instagram_pr_agent.py --status

          ACTION="${{ github.event.inputs.action || 'auto' }}"
          TYPE_ARG=""
          if [ -n "${{ github.event.inputs.content_type }}" ] && [ "${{ github.event.inputs.content_type }}" != "random" ]; then
            TYPE_ARG="--type ${{ github.event.inputs.content_type }}"
          fi

          if [ "$ACTION" = "engage_only" ]; then
            python3 instagram_pr_agent.py --engage
          elif [ "$ACTION" = "direct_publish" ]; then
            python3 instagram_pr_agent.py --direct-publish $TYPE_ARG
          else
            # Default 'auto': Checks frequency interval, directly publishes if due, and runs daily drone engagement
            python3 instagram_pr_agent.py --auto $TYPE_ARG
          fi

          # Commit updated posts, config, and interactions history
          git add assets/instagram/posts/ data/instagram_posts.json data/instagram_config.json data/instagram_interactions.json || true
          git commit -m "chore(instagram-pr): autonomous post & drone engagement update [skip ci]" || true
          git push

          python3 instagram_pr_agent.py --list --limit 10
