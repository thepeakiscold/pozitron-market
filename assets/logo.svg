<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="pz_accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Clean Minimalist Rotor Monogram Icon -->
  <g transform="translate(10, 10)">
    <!-- Sleek outer minimalist ring -->
    <circle cx="30" cy="30" r="28" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" />
    
    <!-- 4 Minimalist Aerodynamic Rotor Blades -->
    <path d="M 30,12 C 32,18 36,24 44,26 C 38,28 32,32 30,48 C 28,32 22,28 16,26 C 24,24 28,18 30,12 Z" 
          fill="url(#pz_accent)" opacity="0.95"/>

    <!-- Center Precision Core -->
    <circle cx="30" cy="30" r="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="30" cy="30" r="2" fill="#0284c7" />

    <!-- 4 Quad Motor Points -->
    <circle cx="18" cy="18" r="2" fill="#94a3b8"/>
    <circle cx="42" cy="18" r="2" fill="#94a3b8"/>
    <circle cx="18" cy="42" r="2" fill="#94a3b8"/>
    <circle cx="42" cy="42" r="2" fill="#94a3b8"/>
  </g>

  <!-- Clean Modern Typography -->
  <!-- POZITRON -->
  <text x="82" y="44" 
        font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="1.5" 
        fill="#0f172a">POZITRON</text>

  <!-- MARKET -->
  <text x="242" y="44" 
        font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-size="28" 
        font-weight="400" 
        letter-spacing="3" 
        fill="#0284c7">MARKET</text>

  <!-- Subtitle / Tagline -->
  <text x="84" y="62" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif" 
        font-size="9" 
        font-weight="600" 
        letter-spacing="2.8" 
        fill="#64748b">DRONE &amp; FPV HARDWARE STORE</text>
</svg>
