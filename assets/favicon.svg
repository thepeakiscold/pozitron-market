<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pz_cyan_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#00c0f8"/>
    </linearGradient>
    <linearGradient id="pz_white_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle Badge -->
  <rect width="512" height="512" rx="112" fill="#080f1e"/>

  <!-- Geometric Cross (+) Drone Body -->
  <g transform="translate(256, 256)">
    <!-- Top Propeller Ring & Motor Hub -->
    <circle cx="0" cy="-140" r="54" fill="none" stroke="url(#pz_cyan_grad)" stroke-width="14"/>
    <circle cx="0" cy="-140" r="14" fill="url(#pz_cyan_grad)"/>
    <path d="M -26,-140 L 26,-140" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

    <!-- Bottom Propeller Ring & Motor Hub -->
    <circle cx="0" cy="140" r="54" fill="none" stroke="url(#pz_cyan_grad)" stroke-width="14"/>
    <circle cx="0" cy="140" r="14" fill="url(#pz_cyan_grad)"/>
    <path d="M -26,140 L 26,140" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

    <!-- Left Propeller Ring & Motor Hub -->
    <circle cx="-140" cy="0" r="54" fill="none" stroke="url(#pz_cyan_grad)" stroke-width="14"/>
    <circle cx="-140" cy="0" r="14" fill="url(#pz_cyan_grad)"/>
    <path d="M -140,-26 L -140,26" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

    <!-- Right Propeller Ring & Motor Hub -->
    <circle cx="140" cy="0" r="54" fill="none" stroke="url(#pz_cyan_grad)" stroke-width="14"/>
    <circle cx="140" cy="0" r="14" fill="url(#pz_cyan_grad)"/>
    <path d="M 140,-26 L 140,26" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

    <!-- Central Symmetrical Cross (+) Aerodynamic Arms -->
    <!-- Top Pylon -->
    <polygon points="0,-140 -34,-24 0,0" fill="url(#pz_cyan_grad)"/>
    <polygon points="0,-140 34,-24 0,0" fill="url(#pz_white_grad)"/>

    <!-- Bottom Pylon -->
    <polygon points="0,140 -34,24 0,0" fill="url(#pz_cyan_grad)"/>
    <polygon points="0,140 34,24 0,0" fill="url(#pz_white_grad)"/>

    <!-- Left Pylon -->
    <polygon points="-140,0 -24,-34 0,0" fill="url(#pz_white_grad)"/>
    <polygon points="-140,0 -24,34 0,0" fill="url(#pz_cyan_grad)"/>

    <!-- Right Pylon -->
    <polygon points="140,0 24,-34 0,0" fill="url(#pz_white_grad)"/>
    <polygon points="140,0 24,34 0,0" fill="url(#pz_cyan_grad)"/>

    <!-- Center Precision Joint -->
    <circle cx="0" cy="0" r="10" fill="#080f1e"/>
  </g>
</svg>
